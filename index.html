
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Wallet</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e7f3ff;color:#183657;font-family:Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:440px;min-height:100vh;margin:auto;padding:20px 17px 85px;background:linear-gradient(160deg,#fff,#d9edff)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:22px;font-weight:bold}.logo span{color:#1687ed}
.muted{color:#6985a4;font-size:12px;margin-top:5px}
.connection{display:flex;align-items:center;gap:6px;padding:8px;background:white;border-radius:20px;font-size:11px;color:#13804d}
.dot{width:8px;height:8px;background:#20c77a;border-radius:50%}
.card{margin-top:22px;padding:23px;border-radius:22px;color:white;background:linear-gradient(130deg,#2388ee,#586be7);box-shadow:0 10px 25px #438bdf30}
.balance{font-size:32px;font-weight:bold;margin:17px 0}
.eye{background:#ffffff30;color:white;border:0;border-radius:8px;padding:7px}
.green{color:#c9ffe7;font-size:13px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}
.action{background:white;color:#234467;border:1px solid #d7e8f8;border-radius:14px;padding:14px 2px;font-size:12px}
.action b{display:block;font-size:22px;color:#2787ec;margin-bottom:8px}
h3{font-size:17px;margin:23px 0 12px}
.panel{background:white;border:1px solid #d8e8f7;border-radius:16px;padding:12px}
.coin{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid #e4eef8}
.coin:last-child{border:0}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:bold;flex-shrink:0}
.info{flex:1}.name{font-weight:bold;font-size:14px}
.price{text-align:right;font-weight:bold;font-size:14px}
.up{color:#159b68;font-size:12px;margin-top:5px}
.down{color:#d94c67;font-size:12px;margin-top:5px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;justify-content:space-around;background:#ffffffed;border-top:1px solid #d6e7f7;padding:12px 2px 17px}
.nav button{background:none;border:0;color:#66809e;font-size:11px}
.nav button span{display:block;font-size:21px;margin-bottom:5px}
.nav button.active{color:#1687ed}
.overlay{display:none;position:fixed;inset:0;background:#17395b66;z-index:5;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.modal{width:100%;max-width:440px;background:#f7fbff;border-radius:23px 23px 0 0;padding:23px 20px 30px;color:#183657}
.close{background:#e2effc;color:#244b70;border:0;border-radius:9px;padding:9px 13px}
label{display:block;color:#547493;font-size:13px;margin-top:13px}
input,select{width:100%;background:white;color:#183657;border:1px solid #cbdff2;border-radius:11px;padding:13px;margin-top:7px}
.primary{width:100%;padding:15px;border:0;border-radius:12px;background:#2588ed;color:white;font-weight:bold;margin-top:18px}
.note{color:#6c83a0;font-size:12px;line-height:1.5}
.toast{display:none;position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#17395b;color:white;padding:13px 17px;border-radius:12px;z-index:10;max-width:90%;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header class="row">
 <div>
  <div class="logo">Crypto<span>Wallet</span></div>
  <div id="clock" class="muted">--:--:--</div>
  <div id="date" class="muted">Đang tải ngày...</div>
 </div>
 <div id="connection" class="connection"><span class="dot"></span> Đang kiểm tra</div>
</header>

<section class="card">
 <div class="row"><span>✨ Tổng tài sản</span><button class="eye" onclick="toggleBalance()">◉</button></div>
 <div id="balance" class="balance">$24,680.50</div>
 <div class="green">▲ +5.29% hôm nay</div>
 <p style="color:#e2eaff;font-size:12px">Số dư ước tính · USD</p>
</section>

<section class="actions">
 <button class="action" onclick="openModal('Nạp tiền')"><b>↓</b>Nạp</button>
 <button class="action" onclick="openModal('Rút tiền')"><b>↑</b>Rút</button>
 <button class="action" onclick="openModal('Gửi crypto')"><b>➤</b>Gửi</button>
 <button class="action" onclick="openModal('Nhận crypto')"><b>▣</b>Nhận</button>
</section>

<div class="row"><h3>Tài sản của tôi</h3><span class="muted">3 loại coin</span></div>
<div class="panel" id="portfolio"></div>
<div class="row"><h3 id="marketTitle">Thị trường</h3><button onclick="loadPrices()" style="border:0;background:none;color:#1687ed">↻ Làm mới</button></div>
<div id="market"></div>
<p class="note" id="status">Giá coin ban đầu là số liệu minh họa.</p>
</div>

<nav class="nav">
<button class="active" onclick="go('home',this)"><span>⌂</span>Trang chủ</button>
<button onclick="go('market',this)"><span>▥</span>Thị trường</button>
<button onclick="openModal('Giao dịch')"><span>⇄</span>Giao dịch</button>
<button onclick="openModal('Tài sản')"><span>▤</span>Tài sản</button>
<button onclick="openModal('Cài đặt')"><span>⚙</span>Cài đặt</button>
</nav>

<div class="overlay" id="overlay" onclick="backdropClose(event)">
<section class="modal">
<div class="row"><h3 id="modalTitle" style="margin:0">Chức năng</h3><button class="close" onclick="closeModal()">✕</button></div>
<div id="modalBody"></div>
</section>
</div>
<div class="toast" id="toast"></div>

<script>
const coins=[
{name:"Bitcoin",symbol:"BTC",icon:"₿",color:"#f7931a",price:67420,change:2.4,amount:.25},
{name:"Ethereum",symbol:"ETH",icon:"◆",color:"#627eea",price:3520,change:1.8,amount:2.4},
{name:"Tether",symbol:"USDT",icon:"₮",color:"#26a17b",price:1,change:.1,amount:850}
];
let visible=true;
function money(n){return n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2})}
function toggleBalance(){visible=!visible;document.getElementById("balance").textContent=visible?"$24,680.50":"••••••••"}
function updateClock(){
const d=new Date();
document.getElementById("clock").textContent=d.toLocaleTimeString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",hour12:false});
document.getElementById("date").textContent=d.toLocaleDateString("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
}
function updateConnection(){
const el=document.getElementById("connection");
el.innerHTML=navigator.onLine?'<span class="dot"></span> Đã kết nối':'<span class="dot" style="background:#e34d59"></span> Mất kết nối';
el.style.color=navigator.onLine?"#13804d":"#c52d3a";
}
function rowCoin(c,portfolio=false){
return `<div class="coin"><div class="icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div><div class="info"><div class="name">${c.name}</div><div class="muted">${portfolio?c.amount+" "+c.symbol:c.symbol}</div></div><div class="price">${money(portfolio?c.amount*c.price:c.price)}<div class="${c.change<0?"down":"up"}">${c.change>=0?"+":""}${c.change}%</div></div></div>`;
}
function render(){
document.getElementById("portfolio").innerHTML=coins.map(c=>rowCoin(c,true)).join("");
document.getElementById("market").innerHTML=coins.map(c=>rowCoin(c)).join("");
}
function openModal(title){
document.getElementById("modalTitle").textContent=title;
const body=document.getElementById("modalBody");
if(title==="Cài đặt"){
body.innerHTML='<p>CryptoWallet · Phiên bản demo</p><p class="note">Ứng dụng giao diện mẫu, chưa kết nối tài khoản thật.</p>';
}else if(title==="Nhận crypto"){
body.innerHTML='<p>Địa chỉ ví demo:</p><input id="address" readonly value="0xDEMO123456789ABCDEF"><button class="primary" onclick="copyAddress()">Sao chép địa chỉ</button><p class="note">Đây không phải địa chỉ ví blockchain thật. Không gửi tiền vào địa chỉ này.</p>';
}else{
body.innerHTML=`<label>Loại coin</label><select id="asset">${coins.map(c=>`<option>${c.symbol}</option>`).join("")}</select><label>Số lượng</label><input id="amount" type="number" min="0" placeholder="Nhập số lượng"><label>Địa chỉ ví hoặc ghi chú</label><input id="destination" placeholder="Nhập thông tin nếu cần"><button class="primary" onclick="submitDemo('${title}')">Xác nhận</button><p class="note">Chỉ là mô phỏng giao diện. Chưa thực hiện giao dịch thật.</p>`;
}
document.getElementById("overlay").classList.add("show");
}
function closeModal(){document.getElementById("overlay").classList.remove("show")}
function backdropClose(e){if(e.target.id==="overlay")closeModal()}
function submitDemo(title){
const n=Number(document.getElementById("amount")?.value||0);
if(n<=0){toast("Vui lòng nhập số lượng hợp lệ");return}
closeModal();toast(title+" là chức năng demo, chưa gửi giao dịch thật.");
}
function copyAddress(){
const el=document.getElementById("address");
el.select();
if(navigator.clipboard&&window.isSecureContext){
navigator.clipboard.writeText(el.value).then(()=>toast("Đã sao chép địa chỉ demo")).catch(()=>toast("Hãy sao chép địa chỉ thủ công"));
}else{document.execCommand("copy");toast("Đã sao chép địa chỉ demo")}
}
function toast(msg){
const el=document.getElementById("toast");el.textContent=msg;el.style.display="block";
setTimeout(()=>el.style.display="none",2500);
}
function go(where,btn){
document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
if(where==="market")document.getElementById("marketTitle").scrollIntoView({behavior:"smooth",block:"start"});
else window.scrollTo({top:0,behavior:"smooth"});
}
async function loadPrices(){
const status=document.getElementById("status");
status.textContent="Đang tải giá trực tuyến...";
try{
const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=usd&include_24hr_change=true");
if(!r.ok)throw Error();
const data=await r.json();
const ids={BTC:"bitcoin",ETH:"ethereum",USDT:"tether"};
coins.forEach(c=>{const x=data[ids[c.symbol]];if(x){c.price=x.usd;c.change=x.usd_24h_change||0}});
render();status.textContent="Giá đã cập nhật từ CoinGecko.";
}catch(e){status.textContent="Không tải được giá. Kiểm tra mạng rồi thử lại."}
}
updateClock();updateConnection();render();
setInterval(updateClock,1000);
window.addEventListener("online",updateConnection);
window.addEventListener("offline",updateConnection);
</script>
</body>
</html>
