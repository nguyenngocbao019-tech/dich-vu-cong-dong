<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet Bảo Pi</title>
    <!-- Lucide Icons & Tailwind CSS CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0712;
            color: #ffffff;
        }

        .bg-purple-card {
            background: linear-gradient(135deg, rgba(58, 20, 89, 0.6) 0%, rgba(26, 10, 46, 0.8) 100%);
            border: 1px solid rgba(147, 51, 234, 0.3);
        }

        .bg-btn-primary {
            background: linear-gradient(90deg, #c026d3 0%, #7e22ce 100%);
        }

        .bg-btn-dark {
            background: rgba(30, 18, 51, 0.7);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen bg-black">

    <!-- Container Mô Phỏng Màn Hình Điện Thoại -->
    <div class="w-full max-w-md bg-[#090510] text-white flex flex-col min-h-screen relative pb-20 shadow-2xl overflow-hidden border-x border-purple-900/30">
        
        <!-- Status Bar & Top Info -->
        <div class="px-5 pt-3 pb-1 flex justify-between items-center text-xs text-gray-400">
            <span id="live-time-top" class="font-semibold text-white">09:11</span>
            <div class="flex items-center space-x-1.5">
                <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                <i data-lucide="battery" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- Header: Logo & Chữ "Wallet Bảo Pi" -->
        <div class="px-5 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 via-red-600 to-purple-600 flex items-center justify-center shadow-lg shadow-red-900/30 border border-amber-400/50">
                        <span class="text-xl font-black text-amber-200 tracking-tighter">BP</span>
                    </div>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-red-400 to-purple-300">
                        Wallet Bảo Pi
                    </h1>
                    <p class="text-[9px] text-red-300/80 font-medium tracking-wide uppercase">Dedicated To Your Success</p>
                </div>
            </div>

            <!-- Nút chọn ngôn ngữ -->
            <button class="flex items-center space-x-1.5 bg-purple-950/60 border border-purple-500/30 rounded-full px-3 py-1 text-xs">
                <span class="text-xs">🇻🇳</span>
                <span class="text-gray-200 font-medium text-[11px]">Tiếng Việt</span>
                <i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i>
            </button>
        </div>

        <!-- Thời gian địa phương -->
        <div class="px-5 pb-3 text-[11px] text-gray-400 flex items-center space-x-1">
            <span>Giờ địa phương</span>
            <span id="current-time" class="font-bold text-gray-200">21:14:33</span>
            <span>Ngày</span>
            <span id="current-date" class="font-bold text-gray-200">Thứ 3, 20/10/2026</span>
            <span class="text-gray-500 text-[10px]">Asia/Saigon</span>
        </div>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 px-4 overflow-y-auto hide-scrollbar space-y-4">
            
            <!-- Selector Ví Chính & Scanner -->
            <div class="flex justify-between items-center py-1">
                <button class="flex items-center space-x-2 text-gray-200 font-bold text-base bg-purple-900/20 px-3 py-1.5 rounded-xl border border-purple-500/20">
                    <i data-lucide="wallet" class="w-4 h-4 text-purple-400"></i>
                    <span>Ví chính</span>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                </button>
                <div class="flex items-center space-x-3">
                    <button class="p-2 text-gray-300 hover:text-white bg-purple-950/40 rounded-full"><i data-lucide="search" class="w-4 h-4"></i></button>
                    <button class="p-2 text-gray-300 hover:text-white bg-purple-950/40 rounded-full"><i data-lucide="scan" class="w-4 h-4"></i></button>
                </div>
            </div>

            <!-- Thẻ Tổng Tài Sản (Khung chính) -->
            <div class="bg-purple-card rounded-2xl p-5 relative overflow-hidden shadow-xl border border-purple-500/30">
                <!-- Họa tiết trang trí góc phải -->
                <div class="absolute -right-6 -top-6 w-32 h-32 rounded-full border border-purple-400/20 pointer-events-none"></div>
                <div class="absolute -right-12 -top-12 w-44 h-44 rounded-full border border-purple-300/10 pointer-events-none"></div>
                
                <div class="flex justify-between items-center mb-1">
                    <div class="flex items-center space-x-2 text-gray-300 text-sm">
                        <span>Tổng tài sản</span>
                        <button id="toggle-balance-btn" class="text-gray-400 hover:text-white">
                            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- SỐ DƯ HIỂN THỊ CỤ THỂ 2,500,000.00 USD -->
                <div class="my-2">
                    <div id="balance-text" class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white flex items-baseline space-x-2">
                        <span>2,500,000.00</span>
                        <span class="text-lg font-bold text-purple-300">USD</span>
                    </div>
                    <p class="text-[11px] text-gray-400 mt-0.5">Ví đã kết nối bảo mật</p>
                </div>

                <div class="flex items-center justify-between pt-3 mt-2 border-t border-purple-500/20">
                    <button class="bg-btn-primary hover:opacity-90 text-white font-semibold text-xs px-4 py-2 rounded-full flex items-center space-x-1.5 shadow-lg shadow-purple-900/50">
                        <span>Kết nối ví</span>
                        <i data-lucide="link-2" class="w-3.5 h-3.5"></i>
                    </button>
                    
                    <button class="bg-purple-950/80 border border-purple-500/30 text-gray-300 text-xs px-3 py-1.5 rounded-full flex items-center space-x-1">
                        <span>Tất cả mạng</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i>
                    </button>
                </div>
            </div>

            <!-- 4 Nút Thao Tác Nhanh -->
            <div class="grid grid-cols-4 gap-2.5 pt-1">
                <button class="bg-btn-dark hover:bg-purple-900/40 p-3 rounded-2xl flex flex-col items-center justify-center space-y-1.5 transition">
                    <div class="w-8 h-8 rounded-full bg-purple-600/20 flex items-center justify-center text-purple-300">
                        <i data-lucide="arrow-up" class="w-4 h-4"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-200">Gửi</span>
                </button>

                <button class="bg-btn-dark hover:bg-purple-900/40 p-3 rounded-2xl flex flex-col items-center justify-center space-y-1.5 transition">
                    <div class="w-8 h-8 rounded-full bg-purple-600/20 flex items-center justify-center text-purple-300">
                        <i data-lucide="arrow-down" class="w-4 h-4"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-200">Nhận</span>
                </button>

                <button class="bg-btn-dark hover:bg-purple-900/40 p-3 rounded-2xl flex flex-col items-center justify-center space-y-1.5 transition">
                    <div class="w-8 h-8 rounded-full bg-purple-600/20 flex items-center justify-center text-purple-300">
                        <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-200">Hoán đổi</span>
                </button>

                <button class="bg-btn-dark hover:bg-purple-900/40 p-3 rounded-2xl flex flex-col items-center justify-center space-y-1.5 transition">
                    <div class="w-8 h-8 rounded-full bg-purple-600/20 flex items-center justify-center text-purple-300">
                        <i data-lucide="grid" class="w-4 h-4"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-200">Tiện ích</span>
                </button>
            </div>

            <!-- Banner Hoán Đổi -->
            <div class="bg-gradient-to-r from-purple-900/50 via-purple-950/60 to-purple-900/40 border border-purple-500/20 p-3.5 rounded-2xl flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="p-2 rounded-xl bg-purple-500/20 text-purple-300">
                        <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-white">Hoán đổi</h4>
                        <p class="text-[11px] text-gray-400">Swap nhanh · Pro tùy chọn</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
            </div>

            <!-- Tab Danh Mục Tài Sản -->
            <div>
                <div class="flex justify-between items-center border-b border-purple-900/40 pb-2">
                    <div class="flex space-x-6">
                        <button class="text-sm font-bold text-white border-b-2 border-purple-500 pb-2 -mb-2">Tài sản</button>
                        <button class="text-sm font-medium text-gray-400 hover:text-gray-200">NFT</button>
                        <button class="text-sm font-medium text-gray-400 hover:text-gray-200">Sổ tài sản</button>
                    </div>
                    <button class="text-purple-400 hover:text-purple-300"><i data-lucide="plus-circle" class="w-5 h-5"></i></button>
                </div>

                <!-- Danh sách Coin -->
                <div id="coin-list-container" class="divide-y divide-purple-900/20 mt-2">
                    <!-- Pi Network -->
                    <div class="py-3 flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs">𝝅</div>
                            <div>
                                <div class="font-bold text-sm text-white">Pi Network</div>
                                <div class="text-[11px] text-gray-400">10,000 PI</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-sm text-white">$31.40</div>
                            <div class="text-[11px] text-emerald-400">+5.2%</div>
                        </div>
                    </div>

                    <!-- Bitcoin -->
                    <div class="py-3 flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center font-bold text-xs">₿</div>
                            <div>
                                <div class="font-bold text-sm text-white">Bitcoin</div>
                                <div class="text-[11px] text-gray-400">2.5 BTC</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-sm text-white">$67,450.00</div>
                            <div class="text-[11px] text-emerald-400">+2.1%</div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- THANH ĐIỀU HƯỚNG DƯỚI CÙNG (FIXED BOTTOM NAVIGATION) -->
        <nav class="absolute bottom-0 left-0 right-0 bg-[#0c0715]/95 backdrop-blur-md border-t border-purple-900/40 px-6 py-2.5 flex justify-between items-center z-50">
            <!-- 1. VÍ -->
            <button class="flex flex-col items-center space-y-1 text-purple-400">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Ví</span>
            </button>

            <!-- 2. THỊ TRƯỜNG -->
            <button class="flex flex-col items-center space-y-1 text-gray-400 hover:text-purple-300">
                <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Thị trường</span>
            </button>

            <!-- 3. GIAO DỊCH -->
            <button class="flex flex-col items-center space-y-1 text-gray-400 hover:text-purple-300">
                <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Giao dịch</span>
            </button>

            <!-- 4. CÁ NHÂN -->
            <button class="flex flex-col items-center space-y-1 text-gray-400 hover:text-purple-300">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">Cá nhân</span>
            </button>
        </nav>

    </div>

    <script>
        // Khởi tạo Lucide Icons
        lucide.createIcons();

        // Ẩn/Hiện số dư
        let isBalanceVisible = true;
        const balanceText = document.getElementById('balance-text');
        const eyeIcon = document.getElementById('eye-icon');
        const toggleBtn = document.getElementById('toggle-balance-btn');

        toggleBtn.addEventListener('click', () => {
            isBalanceVisible = !isBalanceVisible;
            if (isBalanceVisible) {
                balanceText.innerHTML = `<span>2,500,000.00</span> <span class="text-lg font-bold text-purple-300">USD</span>`;
                eyeIcon.setAttribute('data-lucide', 'eye');
            } else {
                balanceText.innerHTML = `<span class="tracking-widest">•••••••••</span>`;
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            }
            lucide.createIcons();
        });

        // Cập nhật đồng hồ thời gian thực
        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const topTimeStr = now.toTimeString().substring(0, 5);
            
            document.getElementById('current-time').textContent = timeStr;
            document.getElementById('live-time-top').textContent = topTimeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
