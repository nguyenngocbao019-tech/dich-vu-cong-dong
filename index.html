<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet Bảo Pi</title>
    <!-- Lucide Icons & Tailwind CSS CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0712;
            color: #ffffff;
        }

        .bg-purple-card {
            background: linear-gradient(135deg, rgba(58, 20, 89, 0.6) 0%, rgba(26, 10, 46, 0.8) 100%);
            border: 1px solid rgba(147, 51, 234, 0.3);
        }

        .bg-btn-primary {
            background: linear-gradient(90deg, #c026d3 0%, #7e22ce 100%);
        }

        .bg-btn-dark {
            background: rgba(30, 18, 51, 0.7);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animation cho Pop-up Modal */
        .modal-enter {
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="flex justify-center min-h-screen bg-black">

    <!-- Container Mô Phỏng Màn Hình Điện Thoại -->
    <div class="w-full max-w-md bg-[#090510] text-white flex flex-col min-h-screen relative pb-20 shadow-2xl overflow-hidden border-x border-purple-900/30">
        
        <!-- Status Bar & Top Info -->
        <div class="px-5 pt-3 pb-1 flex justify-between items-center text-xs text-gray-400">
            <span id="live-time-top" class="font-semibold text-white">09:11</span>
            <div class="flex items-center space-x-1.5">
                <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                <i data-lucide="battery" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- Header: Logo & Chữ "Wallet Bảo Pi" -->
        <div class="px-5 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 via-red-600 to-purple-600 flex items-center justify-center shadow-lg shadow-red-900/30 border border-amber-400/50">
                        <span class="text-xl font-black text-amber-200 tracking-tighter">BP</span>
                    </div>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-red-400 to-purple-300">
                        Wallet Bảo Pi
                    </h1>
                    <p class="text-[9px] text-red-300/80 font-medium tracking-wide uppercase">Dedicated To Your Success</p>
                </div>
            </div>

            <!-- Nút chọn ngôn ngữ -->
            <button onclick="openModal('Ngôn ngữ', 'Chức năng chuyển đổi ngôn ngữ đang hoạt động (Mặc định: Tiếng Việt)')" class="flex items-center space-x-1.5 bg-purple-950/60 border border-purple-500/30 rounded-full px-3 py-1 text-xs active:scale-95 transition">
                <span class="text-xs">🇻🇳</span>
                <span class="text-gray-200 font-medium text-[11px]">Tiếng Việt</span>
                <i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i>
            </button>
        </div>

        <!-- Thời gian địa phương -->
        <div class="px-5 pb-3 text-[11px] text-gray-400 flex items-center space-x-1">
            <span>Giờ địa phương</span>
            <span id="current-time" class="font-bold text-gray-200">21:14:33</span>
            <span>Ngày</span>
            <span id="current-date" class="font-bold text-gray-200">Thứ 3, 20/10/2026</span>
            <span class="text-gray-500 text-[10px]">Asia/Saigon</span>
        </div>

        <!-- TAB CONTENT 1: MÀN HÌNH VÍ -->
        <main id="tab-wallet" class="flex-1 px-4 overflow-y-auto hide-scrollbar space-y-4">
            
            <!-- Selector Ví Chính & Scanner -->
            <div class="flex justify-between items-center py-1">
                <button onclick="openModal('Chọn Ví', 'Danh sách ví khả dụng:<br>• <b>Ví chính (Bảo Pi)</b> - 2,500,000 USD<br>• Ví Phụ 01 - 0.00 USD')" class="flex items-center space-x-2 text-gray-200 font-bold text-base bg-purple-900/20 px-3 py-1.5 rounded-xl border border-purple-500/20 active:scale-95 transition">
                    <i data-lucide="wallet" class="w-4 h-4 text-purple-400"></i>
                    <span>Ví chính</span>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                </button>
                <div class="flex items-center space-x-3">
                    <button onclick="openModal('Tìm kiếm', 'Nhập mã token hoặc hợp đồng thông minh (Smart Contract)...')" class="p-2 text-gray-300 hover:text-white bg-purple-950/40 rounded-full active:scale-95 transition"><i data-lucide="search" class="w-4 h-4"></i></button>
                    <button onclick="openModal('Quét mã QR', 'Đang bật Camera quét mã QR thanh toán...')" class="p-2 text-gray-300 hover:text-white bg-purple-950/40 rounded-full active:scale-95 transition"><i data-lucide="scan" class="w-4 h-4"></i></button>
                </div>
            </div>

            <!-- Thẻ Tổng Tài Sản -->
            <div class="bg-purple-card rounded-2xl p-5 relative overflow-hidden shadow-xl border border-purple-500/30">
                <div class="absolute -right-6 -top-6 w-32 h-32 rounded-full border border-purple-400/20 pointer-events-none"></div>
                <div class="absolute -right-12 -top-12 w-44 h-44 rounded-full border border-purple-300/10 pointer-events-none"></div>
                
                <div class="flex justify-between items-center mb-1">
                    <div class="flex items-center space-x-2 text-gray-300 text-sm">
                        <span>Tổng tài sản</span>
                        <button id="toggle-balance-btn" class="text-gray-400 hover:text-white">
                            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div class="my-2">
                    <div id="balance-text" class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white flex items-baseline space-x-2">
                        <span>2,500,000.00</span>
                        <span class="text-lg font-bold text-purple-300">USD</span>
                    </div>
                    <p class="text-[11px] text-gray-400 mt-0.5">Ví đã kết nối bảo mật</p>
                </div>

                <div class="flex items-center justify-between pt-3 mt-2 border-t border-purple-500/20">
                    <button onclick="openModal('Kết nối ví', 'Trạng thái: <b>Đã kết nối an toàn với Mainnet</b>')" class="bg-btn-primary hover:opacity-90 text-white font-semibold text-xs px-4 py-2 rounded-full flex items-center space-x-1.5 shadow-lg shadow-purple-900/50 active:scale-95 transition">
                        <span>Kết nối ví</span>
                        <i data-lucide="link-2" class="w-3.5 h-3.5"></i>
                    </button>
                    
                    <button onclick="openModal('Chọn mạng', 'Mạng đang chọn: <b>Tất cả mạng (All Networks)</b><br>• Pi Network Mainnet<br>• BNB Smart Chain<br>• Ethereum')" class="bg-purple-950/80 border border-purple-500/30 text-gray-300 text-xs px-3 py-1.5 rounded-full flex items-center space-x-1 active:scale-95 transition">
                        <span>Tất cả mạng</span>
                        <i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i>
                    </button>
                </div>
            </div>

            <!-- 4 Nút Thao Tác Nhanh -->
            <div class="grid grid-cols-4 gap-2.5 pt-1">
                <button onclick="openSendModal()" class="bg-btn-dark hover:bg-purple-900/40 p-3 rounded-2xl flex flex-col items-center justify-center space-y-1.5 active:scale-95 transition">
                    <div class="w-8 h-8 rounded-full bg-purple-600/20 flex items-center justify-center text-purple-300">
                        <i data-lucide="arrow-up" class="w-4 h-4"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-200">Gửi</span>
                </button>

                <button onclick="openReceiveModal()" class="bg-btn-dark hover:bg-purple-900/40 p-3 rounded-2xl flex flex-col items-center justify-center space-y-1.5 active:scale-95 transition">
                    <div class="w-8 h-8 rounded-full bg-purple
