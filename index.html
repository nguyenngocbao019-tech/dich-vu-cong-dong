<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảo pi Wallet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .app-header-bg {
            background: linear-gradient(180deg, #4f46e5 0%, #6366f1 40%, #818cf8 75%, #f8fafc 100%);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .modal-animate {
            animation: slideUp 0.2s ease-out forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Container Mô phỏng Màn hình Điện thoại -->
    <div class="w-full max-w-md h-[100vh] sm:h-[880px] bg-slate-50 flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[36px] border-gray-800">
        
        <!-- Thanh trạng thái & Ngày tháng Thời gian Thực -->
        <div class="app-header-bg pt-3 px-5 pb-2 text-white flex justify-between items-center text-xs font-semibold z-10">
            <span id="realtime-clock" class="font-mono">12:48:00</span>
            <span id="realtime-date" class="text-[11px] opacity-90">Thứ Năm, 22/10/2026</span>
            <div class="flex items-center space-x-1.5">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <span class="text-[10px] bg-white/20 px-1 rounded font-mono">5G</span>
                <i class="fa-solid fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- Khung nội dung cuộn chính -->
        <div class="flex-1 overflow-y-auto hide-scrollbar pb-24 app-header-bg">
            
            <!-- Thanh tác vụ trên cùng -->
            <div class="px-4 py-2 flex justify-between items-center text-white">
                <button onclick="openModal('Quét Mã QR', 'Mở camera để quét mã QR thanh toán hoặc kết nối dApp.')" class="p-2 hover:bg-white/10 rounded-full transition">
                    <i class="fa-solid fa-qrcode text-xl"></i>
                </button>
                
                <div class="bg-black/20 p-1 rounded-full flex items-center space-x-1 border border-white/10">
                    <button onclick="openModal('Chế Độ App', 'Đang chuyển đổi sang trình duyệt ứng dụng phi tập trung.')" class="px-3 py-1 text-xs text-gray-200 rounded-full font-medium hover:text-white">App</button>
                    <button onclick="openModal('Chế Độ Wallet', 'Đang ở giao diện ví tài sản Bảo pi Wallet.')" class="px-3 py-1 text-xs bg-white text-indigo-900 rounded-full font-bold shadow-sm">Wallet</button>
                </div>

                <button onclick="openModal('Cài Đặt Bảo Mật', 'Quản lý khóa riêng tư (Private Key), cụm từ khôi phục (Seed Phrase) và mật khẩu ví.')" class="p-2 hover:bg-white/10 rounded-full transition">
                    <i class="fa-solid fa-gear text-xl"></i>
                </button>
            </div>

            <!-- Tên Ví: Bảo pi Wallet & Địa chỉ, Nút Kết Nối Ví -->
            <div class="px-5 mt-2 flex justify-between items-center text-white">
                <div class="flex items-center space-x-3 cursor-pointer p-1 rounded-xl hover:bg-white/10 transition" onclick="openModal('Quản Lý Tài Khoản', '• Bảo pi Wallet - Tài khoản #1 (Chính)\n• Ví phụ lưu trữ mạng lưới Pi Network & EVM')">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center font-bold text-lg border-2 border-white/40 shadow">
                        <i class="fa-solid fa-shield-cat"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-1 font-bold text-sm">
                            <span>Bảo pi Wallet</span>
                            <i class="fa-solid fa-chevron-down text-xs opacity-70"></i>
                        </div>
                        <div class="text-xs text-indigo-100 font-mono tracking-tight opacity-90">0xf96f...d513</div>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="copyWallet()" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition text-white" title="Sao chép ví">
                        <i class="fa-regular fa-copy text-xs"></i>
                    </button>
                    <!-- Nút Kết Nối Ví -->
                    <button onclick="openModal('Trạng Thái Kết Nối Ví', 'Ví Bảo pi Wallet đã được kết nối an toàn với mạng Web3 chính thức qua cổng bảo mật mã hóa.')" class="px-3 py-1.5 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs shadow-md transition flex items-center space-x-1">
                        <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                        <span>Kết nối ví</span>
                    </button>
                </div>
            </div>

            <!-- Bảng tổng số dư (Hiển thị 89.750 USDT) -->
            <div class="px-5 mt-6 text-center text-white cursor-pointer" onclick="openModal('Chi Tiết Tài Sản Tổng', '• Tether USD (USDT): 89.750,00\n• Bitcoin (BTC): 0.45\n• Ethereum (ETH): 2.15\n• Solana (SOL): 45.00\n• Pi Network (PI): 1,500.00\n• Toncoin (TON): 250.00\n• BNB: 5.80')">
                <div class="text-xs uppercase tracking-wider opacity-80 mb-1 font-medium">Tổng số dư ước tính</div>
                <div class="text-3xl font-black tracking-tight">
                    <span>89.750,00</span> <span class="text-lg font-bold text-emerald-300">USDT</span>
                </div>
                <div class="text-xs text-emerald-300 font-medium mt-1 flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-circle-arrow-up text-[10px]"></i>
                    <span>+2.45% (+$2,148.50 hôm nay)</span>
                </div>
            </div>

            <!-- Các nút thao tác chính (Gửi, Nhận, Livestream, Stake, Thêm) -->
            <div class="px-4 mt-6 grid grid-cols-5 gap-2 text-center text-white">
                <button onclick="openModal('Gửi Tiền (Send)', 'Nhập địa chỉ ví người nhận và số lượng token bạn muốn chuyển đi an toàn.')" class="flex flex-col items-center group">
                    <div class="w-12 h-12 rounded-full bg-white text-gray-800 flex items-center justify-center text-lg shadow-md group-active:scale-90 transition">
                        <i class="fa-solid fa-arrow-up"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Gửi</span>
                </button>

                <button onclick="openModal('Nhận Tiền (Receive)', 'Địa chỉ ví Bảo pi Wallet của bạn:\n0xf96f30a911a8c982d513\n\nQuét mã QR hoặc sao chép địa chỉ để nhận tài sản.')" class="flex flex-col items-center group">
                    <div class="w-12 h-12 rounded-full bg-white text-gray-800 flex items-center justify-center text-lg shadow-md group-active:scale-90 transition">
                        <i class="fa-solid fa-arrow-down"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Nhận</span>
                </button>

                <button onclick="openModal('Livestream Crypto', 'Theo dõi các phiên phát trực tiếp phân tích biến động thị trường và xu hướng coin mới nhất.')" class="flex flex-col items-center group">
                    <div class="w-12 h-12 rounded-full bg-white text-gray-800 flex items-center justify-center text-lg shadow-md group-active:scale-90 transition">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Livestream</span>
                </button>

                <button onclick="openModal('Staking & Lợi Nhuận', 'Gửi tiết kiệm tài sản số nhận lãi suất tích lũy hàng ngày lên đến 14.2%/năm.')" class="flex flex-col items-center group">
                    <div class="w-12 h-12 rounded-full bg-white text-gray-800 flex items-center justify-center text-lg shadow-md group-active:scale-90 transition">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Stake</span>
                </button>

                <button onclick="openModal('Tiện Ích Mở Rộng', '• Cầu nối chuỗi (Cross-chain Bridge)\n• Trình duyệt DApp\n• Mua Crypto bằng thẻ ngân hàng\n• Quản lý NFT độc quyền')" class="flex flex-col items-center group">
                    <div class="w-12 h-12 rounded-full bg-white text-gray-800 flex items-center justify-center text-lg shadow-md group-active:scale-90 transition">
                        <i class="fa-solid fa-border-all"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Thêm</span>
                </button>
            </div>

            <!-- Banner Quảng cáo Card -->
            <div class="px-4 mt-6">
                <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-2xl p-4 text-white relative overflow-hidden shadow-lg border border-white/10">
                    <div class="relative z-10 w-2/3">
                        <h3 class="font-bold text-sm">Get your Visa Card</h3>
                        <p class="text-xs text-gray-300 mt-1">Bảo pi Virtual Card - Chi tiêu toàn cầu</p>
                        <button onclick="openModal('Thẻ Visa Bảo Pi', 'Đăng ký thẻ thanh toán quốc tế liên kết trực tiếp với số dư USDT trong ví của bạn.')" class="mt-3 bg-white text-gray-900 font-bold text-xs px-3.5 py-1.5 rounded-full shadow hover:bg-gray-100 transition active:scale-95">
                            Explore Now
                        </button>
                    </div>
                    <div class="absolute -right-2 -bottom-4 w-28 h-28 opacity-30 pointer-events-none">
                        <i class="fa-solid fa-credit-card text-8xl text-indigo-300"></i>
                    </div>
                </div>
            </div>

            <!-- Thẻ Danh sách Tài sản (Token / NFT / Lịch sử) -->
            <div class="mt-6 bg-white rounded-t-3xl min-h-[500px] p-4 text-gray-800 shadow-xl">
                <!-- Navigation Tab -->
                <div class="flex justify-around border-b border-gray-100 pb-2 mb-4 font-semibold text-sm">
                    <button class="text-indigo-600 border-b-2 border-indigo-600 pb-2 px-2 font-bold">Token</button>
                    <button onclick="openModal('Bộ Sưu Tập NFT', 'Kho lưu trữ các tác phẩm nghệ thuật số và huy hiệu thành viên độc quyền của bạn.')" class="text-gray-400 hover:text-gray-600 pb-2 px-2">NFT</button>
                    <button onclick="openModal('Lịch Sử Giao Dịch', '1. Nạp +89.750,00 USDT (Thành công)\n2. Nhận +1,500.00 PI (Mainnet)\n3. Gửi -0.05 ETH (Phí mạng)')" class="text-gray-400 hover:text-gray-600 pb-2 px-2">Lịch sử</button>
                </div>

                <!-- Thanh Tìm Kiếm & Bộ Lọc -->
                <div class="flex items-center space-x-2 mb-4">
                    <div class="flex items-center space-x-1 bg-gray-100 px-3 py-2 rounded-xl text-xs font-semibold cursor-pointer hover:bg-gray-200" onclick="openModal('Bộ Lọc Mạng Lưới', 'Lọc danh sách token theo chuỗi: Ethereum, BSC, Pi Network, Solana, Toncoin.')">
                        <div class="flex -space-x-1">
                            <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 inline-block border border-white"></span>
                            <span class="w-3.5 h-3.5 rounded-full bg-purple-500 inline-block border border-white"></span>
                        </div>
                        <i class="fa-solid fa-chevron-down text-[10px] text-gray-500"></i>
                    </div>

                    <div class="flex-1 bg-gray-100 rounded-xl px-3 py-2 flex items-center space-x-2">
                        <i class="fa-solid fa-magnifying-glass text-gray-400 text-xs"></i>
                        <input type="text" placeholder="Tìm kiếm tài sản..." class="bg-transparent text-xs w-full focus:outline-none">
                    </div>

                    <button onclick="openModal('Quản Lý Token', 'Bật hoặc tắt các đồng coin tùy chỉnh xuất hiện trên màn hình chính.')" class="p-2 text-gray-500 hover:text-gray-800">
                        <i class="fa-solid fa-sliders"></i>
                    </button>
                </div>

                <!-- Danh sách Coins / Tokens với Logo Thị Trường Chuẩn -->
                <div class="space-y-2">
                    
                    <!-- Tether USD (USDT) -->
                    <div onclick="openModal('Tether USD (USDT)', 'Số dư: 89.750,00 USDT\nGiá thị trường: $1.00 USD\nMạng: Đa chuỗi (ERC-20, TRC-20, BEP-20)')" class="flex items-center justify-between p-2.5 rounded-2xl hover:bg-slate-50 transition cursor-pointer active:bg-slate-100">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-[#26A17B] flex items-center justify-center p-2 shadow-sm">
                                <svg viewBox="0 0 2000 2000" class="w-full h-full fill-white">
                                    <path d="M1000,0 C1552.28,0 2000,447.72 2000,1000 C2000,1552.28 1552.28,2000 1000,2000 C447.72,2000 0,1552.28 0,1000 C0,447.72 447.72,0 1000,0 Z" fill="#26A17B"/>
                                    <path d="M1275,600 L1275,750 L1075,750 L1075,930 C1250,940 1380,980 1380,1030 C1380,1080 1250,1120 1075,1130 L1075,1450 L925,1450 L925,1130 C750,1120 620,1080 620,1030 C620,980 750,940 925,930 L925,750 L725,750 L725,600 L1275,600 Z M1000,970 C830,970 730,1000 730,1030 C730,1060 830,1090 1000,1090 C1170,1090 1270,1060 1270,1030 C1270,1000 1170,970 1000,970 Z" fill="#FFFFFF"/>
                                </svg>
                            </div>
                            <div>
                                <div class="font-bold text-sm text-gray-900">Tether USD</div>
                                <div class="text-xs text-gray-400 font-medium">USDT</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-sm text-emerald-600">89.750,00 USDT</div>
                            <div class="text-xs text-gray-400 font-medium">$89,750.00 <span class="text-emerald-500 text-[10px]">+0.01%</span></div>
                        </div>
                    </div>

                    <!-- Bitcoin (BTC) -->
                    <div onclick="openModal('Bitcoin (BTC)', 'Số dư: 0.45 BTC\nGiá trị thực tế cập nhật theo thị trường toàn cầu.')" class="flex items-center justify-between p-2.5 rounded-2xl hover:bg-slate-50 transition cursor-pointer active:bg-slate-100">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-[#F7931A] text-white flex items-center justify-center p-2 shadow-sm">
                                <svg viewBox="0 0 32 32" class="w-full h-full fill-white">
                                    <path d="M23.189 14.022c0.314-2.096-1.285-3.22-3.473-3.973l0.709-2.846-1.728-0.431-0.69 2.77c-0.454-0.114-0.922-0.22-1.388-0.326l0.694-2.784-1.728-0.431-0.709 2.844c-0.376-0.086-0.746-0.17-1.106-0.258l0.002-0.008-2.385-0.596-0.46 1.846s1.283 0.294 1.257 0.312c0.701 0.175 0.828 0.643 0.807 1.013l-0.808 3.242c0.048 0.012 0.11 0.029 0.178 0.055l-0.183-0.045-1.134 4.548c-0.086 0.214-0.304 0.537-0.795 0.415 0.027 0.039-1.257-0.312-1.257-0.312l-0.86 1.986 2.25 0.562c0.418 0.105 0.828 0.214 1.235 0.318l-0.705 2.834 1.728 0.431 0.707-2.842c0.464 0.126 0.91
