<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Land & Property - Mạng Lưới Bất Động Sản Web3</title>
    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f5f7; color: #333; padding-bottom: 80px; }
        
        /* Header styling */
        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 25px 20px 30px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .header-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .badge { background: #e74c3c; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: normal; }
        .header-subtitle { font-size: 13px; opacity: 0.9; margin-bottom: 15px; }
        
        /* Search Box */
        .search-box { background: white; border-radius: 20px; padding: 10px 15px; display: flex; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .search-box input { border: none; outline: none; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }
        
        /* Main Container */
        .container { padding: 0 15px; margin-top: -15px; }
        
        /* User Profile Card */
        .card { background: white; border-radius: 16px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; background: #e8f4f8; color: #1e3c72; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .user-status { font-size: 12px; color: #27ae60; font-weight: 500; }
        .stats { display: flex; justify-content: space-around; text-align: center; border-top: 1px solid #eee; padding-top: 12px; margin-top: 12px; }
        .stat-num { font-size: 16px; font-weight: bold; color: #1e3c72; }
        .stat-label { font-size: 11px; color: #666; }
        
        /* Grid Categories */
        .section-title { font-size: 16px; font-weight: bold; margin: 15px 0 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .grid-item { background: white; padding: 12px 5px; border-radius: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); cursor: pointer; transition: 0.2s; }
        .grid-item:active { transform: scale(0.95); background: #e8f4f8; }
        .grid-item span { display: block; font-size: 11px; margin-top: 5px; font-weight: 500; }
        
        /* Listing Cards */
        .listing-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); position: relative; }
        .listing-title { font-size: 15px; font-weight: bold; color: #1e3c72; margin-bottom: 6px; }
        .listing-desc { font-size: 12px; color: #555; margin-bottom: 10px; line-height: 1.4; }
        .listing-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #eee; padding-top: 8px; }
        .listing-price { font-size: 14px; font-weight: bold; color: #27ae60; }
        .btn-pay { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .listing-tag { display: inline-block; background: #e8f4f8; color: #2980b9; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; margin-bottom: 6px; }

        /* Floating Post Button */
        .btn-post { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border: none; padding: 14px 24px; border-radius: 30px; font-weight: bold; font-size: 14px; position: fixed; bottom: 20px; right: 20px; box-shadow: 0 4px 15px rgba(30, 60, 114, 0.4); cursor: pointer; z-index: 100; }

        /* Modal Popup form Đăng tin */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; }
        .btn-submit { width: 100%; background: #1e3c72; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <span>🏠 Pi Land & Property</span>
            <span class="badge">Web3 RWA</span>
        </div>
        <div class="header-subtitle">Mạng lưới Bất Động Sản & Dịch Vụ Web3 Toàn Cầu</div>
        <div class="search-box">
            🔍 <input type="text" id="searchInput" onkeyup="searchListings()" placeholder="Tìm kiếm nhà đất, vị trí, dịch vụ tại Cần Thơ...">
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="container">
        <!-- User Info Card -->
        <div class="card" style="margin-top: 15px;">
            <div class="user-info">
                <div class="avatar" id="userAvatar">P</div>
                <div>
                    <strong style="font-size: 15px;" id="usernameDisplay">Đang kết nối Pi...</strong>
                    <div class="user-status" id="authStatus">● Đang xác thực Pi SDK</div>
                </div>
            </div>
            <div class="stats">
                <div><div class="stat-num">120+</div><div class="stat-label">BĐS Đăng Tin</div></div>
                <div><div class="stat-num">350+</div><div class="stat-label">Kết Nối</div></div>
                <div><div class="stat-num">100%</div><div class="stat-label">Uy Tín Pi</div></div>
            </div>
        </div>

        <!-- Categories -->
        <div class="section-title">
            <span>Danh Mục Tiện Ích</span>
            <span style="font-size: 12px; color: #1e3c72; cursor: pointer;" onclick="renderListings('all')">Tất cả →</span>
        </div>

        <div class="grid">
            <div class="grid-item" onclick="filterCategory('ban')">🏡<span>Cần Bán</span></div>
            <div class="grid-item" onclick="filterCategory('thue')">🏢<span>Cho Thụê</span></div>
            <div class="grid-item" onclick="filterCategory('vuon')">🌾<span>Đất Vườn</span></div>
            <div class="grid-item" onclick="filterCategory('dichvu')">🤝<span>Dịch Vụ</span></div>
        </div>

        <!-- Listings Section -->
        <div class="section-title" style="margin-top: 20px;">
            <span>Tin Đăng Mới Nhất</span>
        </div>

        <div id="listingsContainer">
            <!-- Tin đăng sẽ được tự động tải từ JavaScript -->
        </div>
    </div>

    <!-- Nút Đăng Tin -->
    <button class="btn-post" onclick="openPostModal()">➕ Đăng Tin Mới</button>

    <!-- Popup Modal Form Đăng Tin -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Tạo Tin Đăng BĐS / Dịch Vụ</span>
                <span style="cursor: pointer;" onclick="closePostModal()">✕</span>
            </div>
            <div class="form-group">
                <label>Tiêu đề tin đăng</label>
                <input type="text" id="postTitle" placeholder="Ví dụ: Bán 100m2 đất Ninh Kiều...">
            </div>
            <div class="form-group">
                <label>Loại danh mục</label>
                <select id="postCategory">
                    <option value="ban">Cần Bán</option>
                    <option value="thue">Cho Thụê</option>
                    <option value="vuon">Đất Vườn</option>
                    <option value="dichvu">Dịch Vụ BĐS</option>
                </select>
            </div>
            <div class="form-group">
                <label>Giá đặt cọc / Thanh toán (Pi)</label>
                <input type="number" id="postPrice" placeholder="Ví dụ: 5">
            </div>
            <div class="form-group">
                <label>Mô tả chi tiết</label>
                <textarea id="postDesc" rows="3" placeholder="Nhập địa chỉ, đặc điểm nhà đất..."></textarea>
            </div>
            <button class="btn-submit" onclick="submitNewPost()">Đăng Tin Lên Mạng Lưới</button>
        </div>
    </div>

    <!-- JavaScript Xử Lý Pi SDK & Giao Diện -->
    <script>
        // Khởi tạo Pi SDK
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: false });

        let currentUser = null;

        // Dữ liệu mẫu danh sách tin đăng
        let listings = [
            { id: 1, title: "Bán đất thổ cư 100m² trung tâm Ninh Kiều, Cần Thơ", category: "ban", desc: "Mặt tiền hẻm ô tô, sổ hồng riêng, chấp nhận cọc/thanh toán bằng Pi.", price: 10, location: "Ninh Kiều" },
            { id: 2, title: "Cho thuê mặt bằng kinh doanh tại Cần Thơ", category: "thue", desc: "Vị trí đẹp, thích hợp làm văn phòng, cửa hàng. Chấp nhận nhận cọc 1 tháng bằng Pi.", price: 2, location: "Cần Thơ" },
            { id: 3, title: "Dịch vụ thẩm định & đo đạc đất đai Cần Thơ", category: "dichvu", desc: "Nhận đo đạc, kiểm tra quy hoạch, hỗ trợ thủ tục pháp lý trọn gói.", price: 1, location: "Toàn Cần Thơ" }
        ];

        // Tự động xác thực tài khoản Pi khi mở App
        async function authenticatePi() {
            try {
                const scopes = ['username', 'payments'];
                function onIncompletePaymentFound(payment) { console.log("Incomplete Payment:", payment); }
                
                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                currentUser = auth.user;
                
                document.getElementById('usernameDisplay').innerText = currentUser.username;
                document.getElementById('userAvatar').innerText = currentUser.username.charAt(0).toUpperCase();
                document.getElementById('authStatus').innerText = "● Đã xác thực Pi Auth (KYC)";
            } catch (err) {
                console.error("Pi Auth Error:", err);
                document.getElementById('usernameDisplay').innerText = "Pioneer";
                document.getElementById('authStatus').innerText = "● Chưa kết nối Pi SDK";
            }
        }

        // Tải danh sách tin đăng ra màn hình
        function renderListings(categoryFilter = 'all') {
            const container = document.getElementById('listingsContainer');
            container.innerHTML = '';

            const filtered = categoryFilter === 'all' ? listings : listings.filter(item => item.category === categoryFilter);

            if(filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Chưa có tin đăng trong mục này.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'listing-card';
                card.innerHTML = `
                    <span class="listing-tag">${item.category.toUpperCase()} • ${item.location}</span>
                    <div class="listing-title">${item.title}</div>
                    <div class="listing-desc">${item.desc}</div>
                    <div class="listing-footer">
                        <div class="listing-price">💰 ${item.price} Pi</div>
                        <button class="btn-pay" onclick="payWithPi(${item.price}, '${item.title}')">Giao dịch bằng Pi</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Hàm thanh toán / cọc bằng Pi SDK
        function payWithPi(amount, title) {
            if (!currentUser) {
                alert("Vui lòng truy cập qua Pi Browser để thanh toán bằng Pi!");
                return;
            }

            Pi.createPayment({
                amount: amount,
                memo: "Thanh toán/Cọc tin: " + title,
                metadata: { itemTitle: title }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    console.log("Payment Ready for Approval:", paymentId);
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    alert("Giao dịch thành công! TXID: " + txid);
                },
                onCancel: function(paymentId) {
                    alert("Giao dịch đã hủy.");
                },
                onError: function(error, payment) {
                    alert("Lỗi giao dịch: " + error.message);
                }
            });
        }

        // Lọc theo danh mục khi bấm nút
        function filterCategory(cat) { renderListings(cat); }

        // Bật / Tắt Modal Đăng Tin
        function openPostModal() { document.getElementById('postModal').style.display = 'flex'; }
        function closePostModal() { document.getElementById('postModal').style.display = 'none'; }

        // Đăng tin mới
        function submitNewPost() {
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('postCategory').value;
            const price = parseFloat(document.getElementById('postPrice').value) || 1;
            const desc = document.getElementById('postDesc').value;

            if(!title || !desc) {
                alert("Vui lòng điền đầy đủ thông tin!");
                return;
            }

            const newListing = {
                id: listings.length + 1,
                title: title,
                category: category,
                desc: desc,
                price: price,
                location: "Cần Thơ"
            };

            listings.unshift(newListing);
            renderListings('all');
            closePostModal();

            // Clear input
            document.getElementById('postTitle').value = '';
            document.getElementById('postDesc').value = '';
            alert("Đã đăng tin mới thành công lên hệ thống!");
        }

        // Khởi chạy khi load trang
        window.onload = function() {
            authenticatePi();
            renderListings('all');
        };
    </script>
</body>
</html>
